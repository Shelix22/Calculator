<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css"></link>
</head>
<body>
    <div class="calc">
        <div id="div23" class="input">
            <input id="calc-input" placeholder="Type here">
        </div>
        <div class="keys">
            <div id="div1">
                <button class="lg-button" id="backspace-button" onclick="removeFromDisplay()">
                    <svg fill="white" xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#e3e3e3"><path d="m456-320 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 160q-19 0-36-8.5T296-192L80-480l216-288q11-15 28-23.5t36-8.5h440q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H360ZM180-480l180 240h440v-480H360L180-480Zm400 0Z"/></svg>
                </button>
            </div>
            <div id="div2">
                <button class="lg-button" id="ac-button">
                    AC
                </button>
            </div>
            <div id="div3">
                <button class="dg-button" id="1-button">
                    1
                </button>
            </div>
            <div id="div4">
                <button class="dg-button" id="2-button">
                    2
                </button>
            </div>
            <div id="div5">
                <button class="dg-button" id="4-button">
                    4
                </button>
            </div>
            <div id="div6">
                <button class="dg-button" id="5-button">
                    5
                </button>
            </div>
            <div id="div7">
                <button class="dg-button" id="7-button">
                    7
                </button>
            </div>
            <div id="div8">
                <button class="wh-button" id="result-button">
                    =
                </button>
            </div>
            <div id="div9">
                <button class="dg-button" id="0-button">
                    0
                </button>
            </div>
            <div id="div10">
                <button class="dg-button" id="8-button">
                    8
                </button>
            </div>
            <div id="div11">
                <button class="lg-button" id="modulo-button">
                    %
                </button>
            </div>
            <div id="div12">
                <button class="dg-button" id="3-button">
                    3
                </button>
            </div>
            <div id="div13">
                <button class="dg-button" id="6-button">
                    6
                </button>
            </div>
            <div id="div14">
                <button class="dg-button" id="9-button">
                    9
                </button>
            </div>
            <div id="div15">
                <button class="dg-button" id="closing-button">
                    )
                </button>
            </div>
            <div id="div16">
                <button class="og-button" id="divide-button">
                    <svg width="50" height="50" viewBox="0 0 20 20" stroke="white" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 11C4.44772 11 4 10.5523 4 10C4 9.44772 4.44772 9 5 9H15C15.5523 9 16 9.44772 16 10C16 10.5523 15.5523 11 15 11H5Z" fill="white"/>
                    <circle cx="10" cy="5.5" r="1.0" fill="white"/>
                    <circle cx="10" cy="14.5" r="1.0" fill="white"/>
                    </svg>
                </button>
            </div>
            <div id="div17">
                <button class="og-button" id="multiply-button">
                    x
                </button>
            </div>
            <div id="div18">
                <button class="og-button" id="subtract-button">
                    -
                </button>
            </div>
            <div id="div19">
                <button class="og-button" id="exponent-button">
                    xʸ
                </button>
            </div>
            <div id="div20">
                <button class="og-button" id="add-button">
                    +
                </button>
            </div>
            <div id="div21">
                <button class="dg-button" id="opening-button">
                    (
                </button>
            </div>
            <div id="div22">
                <button class="og-button" id="decimal-button">
                    .
                </button>
            </div>
        </div>
    </div>
</body>
</html>
